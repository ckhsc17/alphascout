name: US daily

on:
  schedule:
    # 02:30 UTC Tue–Sat: after EDGAR publishes the previous US business day's daily index.
    - cron: "30 2 * * 2-6"
  workflow_dispatch:
    inputs:
      since:
        description: "13F: earliest period of report (YYYY-MM-DD). Defaults to nine quarters back."
        required: false
      date:
        description: "Form 4: filing date (YYYY-MM-DD). Defaults to yesterday (UTC)."
        required: false

concurrency:
  group: us-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ingest 13F filings and map CUSIPs
        run: pnpm --filter @alphascout/jobs job us:13f ${{ inputs.since && format('--since {0}', inputs.since) || '' }}
      - name: Ingest Form 4 insider trades
        run: pnpm --filter @alphascout/jobs job us:form4 ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
